name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          base64 -d TollSum-project-v1.30.txt > project.zip
          unzip -q project.zip
          cp -a TollSum/. .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: release-key.jks
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          gradle --no-daemon --max-workers=1 assembleRelease --stacktrace
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/통행료-얼마-나왔지-v1.30.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: toll-sum-release-v1.30
          path: app/build/outputs/apk/release/통행료-얼마-나왔지-v1.30.apk
          if-no-files-found: error
