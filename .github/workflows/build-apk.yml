name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Restore Android project
        run: |
          base64 -d TollSum-project-v1.08.txt > project.zip
          unzip -q project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: TollSum
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp TollSum/app/build/outputs/apk/debug/app-debug.apk "통행료 얼마 나왔지.apk"

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: 통행료-얼마-나왔지
          path: 통행료 얼마 나왔지.apk
          if-no-files-found: error
